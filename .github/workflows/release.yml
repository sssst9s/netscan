name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - name: Install cross compiler
        if: matrix.cross
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build the command line tool
        run: cargo build --release --target ${{ matrix.target }} -p netscan-cli

      - name: Build the desktop application
        if: '!matrix.cross'
        run: cargo build --release --target ${{ matrix.target }} -p netscan-gui

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -n "${{ github.event.inputs.tag || '' }}" ]; then
            version="${{ github.event.inputs.tag }}"
            version="${version#v}"
          fi
          staging="netscan-${version}-${{ matrix.target }}"
          mkdir -p "$staging"
          bin_dir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bin_dir/netscan.exe" "$staging/"
            [ -f "$bin_dir/netscan-gui.exe" ] && cp "$bin_dir/netscan-gui.exe" "$staging/"
          else
            cp "$bin_dir/netscan" "$staging/"
            [ -f "$bin_dir/netscan-gui" ] && cp "$bin_dir/netscan-gui" "$staging/"
          fi
          cp README.md LICENSE INSTALL.md USAGE.md SECURITY.md "$staging/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$staging.zip" "$staging"
            certutil -hashfile "$staging.zip" SHA256 | sed -n 2p | tr -d ' \r' > "$staging.zip.sha256"
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
            echo "CHECKSUM=$staging.zip.sha256" >> "$GITHUB_ENV"
          else
            tar czf "$staging.tar.gz" "$staging"
            shasum -a 256 "$staging.tar.gz" | cut -d' ' -f1 > "$staging.tar.gz.sha256"
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
            echo "CHECKSUM=$staging.tar.gz.sha256" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract the release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md." > notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  formula:
    name: Update the Homebrew formula
    needs: publish
    if: '!contains(github.ref_name, ''-'')'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release

      - name: Point the formula at this tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          curl -fsSL "$url" -o source.tar.gz
          sha=$(sha256sum source.tar.gz | cut -d' ' -f1)
          rm source.tar.gz
          sed -i "s|url \".*\"|url \"${url}\"|" Formula/netscan.rb
          sed -i "s|sha256 \".*\"|sha256 \"${sha}\"|" Formula/netscan.rb

      - name: Commit the formula
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formula already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/netscan.rb
          git commit -m "Point the Homebrew formula at ${GITHUB_REF_NAME}"
          git push origin release
