name: Bug report
description: Something does not work the way it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not open an issue. See SECURITY.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, and what it did.
      placeholder: |
        $ netscan 192.168.1.0/24 -sV
        ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `netscan --version`.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Linux, Windows]
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Where
      options: [command line, desktop application, both]
    validations:
      required: true

  - type: textarea
    id: debug
    attributes:
      label: Debug output
      description: The output of the same command with `--debug`, if you can run it.
      render: text
