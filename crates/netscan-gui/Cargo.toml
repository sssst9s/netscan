[package]
name = "netscan-gui"
description = "netscan desktop application: a network scanner and analyser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "netscan-gui"
path = "src/main.rs"

[features]
default = []
raw = ["netscan-core/raw"]

[dependencies]
netscan-core = { workspace = true }

eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"
egui_extras = { version = "0.29", default-features = false }

tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync"] }
chrono = { workspace = true }
ipnet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[dev-dependencies]
tempfile = "3"
